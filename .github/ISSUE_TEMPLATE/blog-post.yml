name: New blog post
description: Add a blog post to the site
title: "New blog post"
body:
  - type: input
    id: post-title
    attributes:
      label: Post title
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
    validations:
      required: true
  - type: textarea
    id: post
    attributes:
      label: Post
      description: Write or paste the post here. Use the Preview tab to see how it looks, and drag photos in where you want them.
    validations:
      required: true
  - type: textarea
    id: post-image
    attributes:
      label: Post image
    validations:
      required: true
