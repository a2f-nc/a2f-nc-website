name: Issue preview link
# When Vercel finishes a preview for one of Claude's pull requests (branch claude/issue-<N>-…), post the preview
# link on issue <N>, so the whole conversation can stay in the issue. It keeps one comment and updates it, so
# each new push changes the same link instead of adding another comment.
on: deployment_status

permissions:
  contents: read

jobs:
  link:
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Preview')
    permissions:
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Post or update the preview link on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.deployment.sha }}
          URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: |
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.state == "open")][0] // empty')
          if [ -z "$pr" ]; then echo "No open pull request for $SHA"; exit 0; fi
          branch=$(jq -r .head.ref <<<"$pr")
          num=$(jq -r .number <<<"$pr")
          if [[ ! "$branch" =~ ^claude/issue-([0-9]+)- ]]; then echo "$branch is not a Claude issue branch"; exit 0; fi
          issue="${BASH_REMATCH[1]}"
          marker="<!-- issue-preview-link -->"
          printf -v body '%s\n🔎 **Preview is ready:** %s\n\nThis shows pull request #%s as of commit %s. It updates here each time Claude pushes a change.\nReply on this issue with anything you would like changed. When it looks right, approve and merge #%s to publish it.' \
            "$marker" "$URL" "$num" "${SHA:0:7}" "$num"
          id=$(gh api "repos/$REPO/issues/$issue/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$issue/comments" -f body="$body" > /dev/null
          fi
          echo "Preview link for #$num posted on issue #$issue"
