# Keeps the tools around the website up to date. The website itself has no dependencies.
# Dependabot opens a pull request when something needs updating; the check and test jobs
# run on it and Vercel posts a preview. Security fixes and minor or patch bumps merge
# themselves once check and test pass (the dependabot-automerge job in check-site.yml).
# Major version bumps get their own pull request and wait for a person.
version: 2
updates:
  # Versions of the GitHub Actions used in .github/workflows (checkout, setup-python, claude-code-action)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      security-actions:
        applies-to: security-updates
        patterns: ["*"]

  # Test tools in requirements-dev.txt (pytest, playwright)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      test-tools:
        patterns: ["*"]
        update-types: [minor, patch]
      security-test-tools:
        applies-to: security-updates
        patterns: ["*"]
