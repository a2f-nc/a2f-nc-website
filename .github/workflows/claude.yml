name: Claude
# Lets the team ask Claude for website changes, with the whole conversation in the issue:
#  - open an issue: Claude starts on it automatically if the author has write access to the repo
#    (issues from anyone else wait until someone with write access adds the "claude" label)
#  - comment on that issue with feedback (no @claude needed): Claude updates the same pull request and replies there
#  - the preview link is posted on the issue too (see issue-preview-link.yml)
#  - "@claude ..." on a pull request still works, and so does adding the "claude" label to an issue
# Needs one repo secret: CLAUDE_CODE_OAUTH_TOKEN (Claude Pro/Max, from `claude setup-token`)
# or ANTHROPIC_API_KEY (from console.anthropic.com). See SETUP.md step 7.
on:
  issues:
    types: [opened, assigned, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  # New issues, the "claude" label, and @claude on pull requests.
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    if: |
      (github.event_name == 'issues' && github.event.action == 'opened' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude') || github.event.label.name == 'claude')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # So Claude can run the site check and the tests before pushing
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          branch_name_template: "{{prefix}}{{entityType}}-{{entityNumber}}-{{description}}"
          # A newly opened issue has no @claude in it, so give Claude its task directly. track_progress keeps the
          # usual flow: a progress comment on the issue and a claude/issue-… branch. Other events leave both off.
          track_progress: ${{ github.event_name == 'issues' && github.event.action == 'opened' }}
          prompt: ${{ github.event_name == 'issues' && github.event.action == 'opened' && 'This issue was just opened by someone on the team. Treat it as a request for a change to the website and carry it out. If it is a question or is too unclear to act on, reply on the issue with what you need instead of changing files.' || '' }}
          claude_args: |
            --allowedTools "Bash(python3 tools/check.py),Bash(python3 -m pytest:*),Bash(python -m pytest:*),Bash(gh pr create:*),Bash(gh pr view:*)"
            --append-system-prompt "When you are working from an issue (not a pull request), finish by opening a pull request yourself with gh pr create (base: main). Its body must say 'Closes #<issue number>', explain the change in plain language for non-developer volunteers, and list which pages to check on the Vercel preview. Then update your comment on the issue with a link to the pull request and a note that the preview link will be posted on the issue in a minute or two, and that they can reply on the issue with any changes. When you are asked for changes on an existing pull request, push to that pull request's branch. Always run python3 tools/check.py and python3 -m pytest before you push, and fix anything they report."

  # A team member comments on an issue (with or without @claude). If Claude already has a pull request open for the
  # issue, Claude makes the changes on that same pull request and answers on the issue. If Claude asked a question
  # and there is no pull request yet, Claude picks the issue back up. Other comments are left alone.
  issue-feedback:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    if: |
      github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Find Claude's open pull request for this issue
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          # Only a pull request whose branch lives in this repo (so it was pushed by someone with write access, or by
          # Claude). A fork can name its branch claude/issue-N-… too, and must never be checked out here.
          found=$(gh pr list -R "$REPO" --state open --limit 100 --json number,headRefName,headRefOid,isCrossRepository \
            --jq "[.[] | select(.isCrossRepository == false and (.headRefName | startswith(\"claude/issue-$ISSUE-\")))][0] // empty")
          branch=""; pr=""; sha=""
          if [ -n "$found" ]; then
            branch=$(jq -r .headRefName <<<"$found"); pr=$(jq -r .number <<<"$found"); sha=$(jq -r .headRefOid <<<"$found")
          fi
          asked=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate --jq '.[] | select(.user.login == "claude[bot]") | .id' | wc -l)
          involved=false
          if [ -n "$branch" ] || [ "$asked" -gt 0 ] || [[ "$BODY" == *"@claude"* ]] || [[ "$LABELS" == *'"claude"'* ]]; then involved=true; fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "involved=$involved" >> "$GITHUB_OUTPUT"
          echo "Open Claude PR branch: ${branch:-none}; Claude involved: $involved"
      - uses: actions/checkout@v4
        if: steps.find.outputs.involved == 'true'
        with:
          # The exact commit found above, not the branch name, so nothing pushed in between can sneak in.
          ref: ${{ steps.find.outputs.sha || github.event.repository.default_branch }}
      - name: Name the checked-out commit after its branch, so Claude can push to it
        if: steps.find.outputs.branch != ''
        env:
          BRANCH: ${{ steps.find.outputs.branch }}
        run: git checkout -B "$BRANCH"
      - uses: actions/setup-python@v5
        if: steps.find.outputs.involved == 'true'
        with:
          python-version: "3.12"
      - name: Install test tools
        if: steps.find.outputs.involved == 'true'
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      # There is already a pull request: work on its branch, which is checked out above.
      - name: Update the existing pull request
        if: steps.find.outputs.branch != ''
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_BRANCH: ${{ steps.find.outputs.branch }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are continuing work on issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            Your pull request for it is #${{ steps.find.outputs.pr }}, on branch ${{ steps.find.outputs.branch }}, which is checked out.
            Read the issue and its comments first: gh issue view ${{ github.event.issue.number }} --comments
            A team member, @${{ github.event.comment.user.login }}, just left this comment on the issue:

            ${{ github.event.comment.body }}

            If it asks for changes, make them on this branch, run python3 tools/check.py and python3 -m pytest and fix
            anything they report, commit, and push with: git push origin HEAD
            Then reply on the issue with gh issue comment ${{ github.event.issue.number }} --body "...": say in plain
            language what you changed and that the preview link on the issue updates in a minute or two.
            If it is a question or a thank-you rather than a change request, just reply on the issue. Never push to any
            other branch, and never merge.
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin HEAD),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr view:*),Bash(python3 tools/check.py),Bash(python3 -m pytest:*),Bash(python -m pytest:*)"
      # No pull request yet (Claude asked a question, or was asked with @claude): pick the issue back up.
      - name: Pick the issue back up
        if: steps.find.outputs.branch == '' && steps.find.outputs.involved == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          branch_name_template: "{{prefix}}{{entityType}}-{{entityNumber}}-{{description}}"
          track_progress: true
          prompt: "A team member just replied on this issue. Read the whole issue and its comments, then carry out the requested website change. If it is still too unclear to act on, reply on the issue with what you need."
          claude_args: |
            --allowedTools "Bash(python3 tools/check.py),Bash(python3 -m pytest:*),Bash(python -m pytest:*),Bash(gh pr create:*),Bash(gh pr view:*)"
            --append-system-prompt "Finish by opening a pull request yourself with gh pr create (base: main). Its body must say 'Closes #<issue number>', explain the change in plain language for non-developer volunteers, and list which pages to check on the Vercel preview. Then update your comment on the issue with a link to the pull request, and say they can reply on the issue with any changes. Always run python3 tools/check.py and python3 -m pytest before you push, and fix anything they report."
