name: Check site
on:
  pull_request:
  push:
    branches: [main]
# The check and test jobs only read the code; the Dependabot job below asks for more on its own.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links, alt text, page titles, copy and asset sizes
        run: python3 tools/check.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test tools
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run tests (every page at phone and desktop width, stories, reels, Pull up sheet, calendar, FAQ, swipe deck, tabs, SEO, redirects)
        run: python -m pytest

  # Dependabot's pull requests merge themselves once check and test pass, if they are a security fix
  # or a minor or patch version bump. Major version bumps wait for a person. See SETUP.md step 9.
  dependabot-automerge:
    needs: [check, test]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Approve and turn on auto-merge
        if: >-
          startsWith(steps.meta.outputs.dependency-group, 'security-') ||
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Approving needs "Allow GitHub Actions to create and approve pull requests" (SETUP.md step 9).
          # Without it the pull request still merges itself once someone approves it.
          gh pr review --approve "$PR" || echo "Couldn't approve; a person needs to approve this one."
          gh pr merge --auto --squash "$PR"
