name: New blog post
description: Add a blog post to the site
title: "Post title"
body:
  - type: input
    id: author
    attributes:
      label: Author
    validations:
      required: true
  - type: textarea
    id: post
    attributes:
      label: Post
      description: |
        Write or paste the post here. Use the Preview tab to see how it looks, and drag photos in where you want them.
        Supported: headings, bold, italic, links, bullet and numbered lists, quotes and photos.
        Not supported: tables, code blocks and lists inside lists.
    validations:
      required: true
  - type: textarea
    id: post-image
    attributes:
      label: Post image
    validations:
      required: true
